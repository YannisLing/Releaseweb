<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>情绪光谱 · 从万念俱灰到平和</title>
<style>
  :root{
    --accent:#9aa3b2;
    --bg:#0a0c11;
    --ink:#e9ecf4;
    --muted:#a6aec1;
    --serif:"KaiTi","STKaiti","Noto Serif SC","Source Han Serif SC",STSong,SimSun,serif;
    --sans:"PingFang SC","Microsoft YaHei","Segoe UI",system-ui,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--sans);
    overflow-x:hidden;
    min-height:100vh;
    -webkit-tap-highlight-color:transparent;
  }
  ::selection{background:var(--accent);color:#0a0c11}

  /* ---------- 背景光晕 ---------- */
  .aurora{position:fixed;inset:0;z-index:-2;overflow:hidden;pointer-events:none}
  .blob{
    position:absolute;width:64vmax;height:64vmax;border-radius:50%;
    filter:blur(100px);opacity:.14;
    background:radial-gradient(circle,var(--accent),transparent 62%);
    transition:background 1.4s ease;
    will-change:transform;
  }
  .blob.b1{top:-22vmax;left:-14vmax;animation:drift 30s ease-in-out infinite alternate}
  .blob.b2{bottom:-26vmax;right:-16vmax;animation:drift 36s ease-in-out infinite alternate-reverse;
    background:radial-gradient(circle,color-mix(in srgb,var(--accent) 55%,#3d4f8a),transparent 62%)}
  .blob.b3{top:30%;left:42%;width:40vmax;height:40vmax;opacity:.08;animation:drift 24s ease-in-out infinite alternate}
  @keyframes drift{
    from{transform:translate(-6%,-4%) scale(1)}
    to{transform:translate(7%,9%) scale(1.18)}
  }
  #bg{position:fixed;inset:0;z-index:-1;pointer-events:none}

  /* ---------- 头部 ---------- */
  header{text-align:center;padding:72px 20px 8px;position:relative}
  .eyebrow{
    display:inline-block;font-size:12px;letter-spacing:.55em;text-indent:.55em;
    color:var(--muted);border:1px solid rgba(255,255,255,.12);
    padding:7px 18px;border-radius:999px;margin-bottom:26px;
    -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);transition:border-color .5s;
  }
  h1{
    font-family:var(--serif);font-weight:700;
    font-size:clamp(46px,7.4vw,88px);letter-spacing:.14em;text-indent:.14em;
    background:linear-gradient(115deg,#f4f6fb 25%,var(--accent) 50%,#f4f6fb 75%);
    background-size:220% auto;
    -webkit-background-clip:text;background-clip:text;color:transparent;
    animation:shimmer 9s linear infinite;
  }
  @keyframes shimmer{to{background-position:220% center}}
  .subtitle{margin-top:18px;color:var(--muted);font-size:15px;letter-spacing:.28em;text-indent:.28em}
  .hint{margin-top:12px;color:#5d6577;font-size:12px;letter-spacing:.12em}

  /* ---------- 光谱导航 ---------- */
  .spectrum-wrap{max-width:1020px;margin:44px auto 0;padding:0 18px;overflow-x:auto;scrollbar-width:none}
  .spectrum-wrap::-webkit-scrollbar{display:none}
  .spectrum{position:relative;min-width:640px;padding-bottom:6px}
  .track{
    position:absolute;top:15px;left:calc(100%/18);right:calc(100%/18);
    height:2px;background:rgba(255,255,255,.09);border-radius:2px;
  }
  .track-fill{
    position:absolute;top:15px;left:calc(100%/18);height:2px;border-radius:2px;
    background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 45%,transparent),var(--accent));
    box-shadow:0 0 12px var(--accent);
    width:0;transition:width .9s cubic-bezier(.6,.1,.2,1),background 1s;
  }
  .nodes{position:relative;display:flex}
  .node{
    flex:1;background:none;border:none;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:11px;
    color:#8b93a6;padding:0 0 4px;transition:color .35s;position:relative;touch-action:manipulation;
  }
  .node .dot{
    width:13px;height:13px;border-radius:50%;
    background:#20242f;border:2px solid #3a4152;
    transition:all .4s cubic-bezier(.5,1.6,.4,1);
  }
  .node .lbl{font-size:12.5px;letter-spacing:.08em;white-space:nowrap}
  .node .num{font-size:9px;letter-spacing:.2em;color:#565e70;transition:color .35s}
  .node:hover{color:#d6dbe8}
  .node:hover .dot{transform:scale(1.3);border-color:#6b7590}
  .node.active{color:#fff}
  .node.active .num{color:var(--accent)}
  .node.active .dot{
    background:var(--accent);border-color:var(--accent);transform:scale(1.45);
    box-shadow:0 0 0 5px color-mix(in srgb,var(--accent) 22%,transparent),0 0 20px var(--accent);
  }

  /* ---------- 主舞台 ---------- */
  main{max-width:1180px;margin:64px auto 0;padding:0 26px}
  .stage{display:grid;grid-template-columns:315px 1fr;gap:52px;align-items:start}

  .level-head{position:sticky;top:36px}
  .level-idx{
    font-size:12px;letter-spacing:.45em;color:var(--accent);
    transition:color .6s;
  }
  .level-name{
    font-family:var(--serif);font-weight:700;
    font-size:clamp(44px,4.6vw,60px);letter-spacing:.1em;
    color:#fff;margin:14px 0 6px;line-height:1.15;
  }
  .level-name.re, .level-desc.re{animation:fadeUp .7s cubic-bezier(.2,.7,.3,1) both}
  @keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
  .level-en{font-size:12.5px;letter-spacing:.5em;color:var(--accent);transition:color .6s}
  .level-rule{
    width:56px;height:3px;border-radius:3px;margin:22px 0;
    background:var(--accent);box-shadow:0 0 14px var(--accent);
    transition:background .6s,box-shadow .6s;
  }
  .level-desc{color:var(--muted);font-size:14.5px;line-height:2.05;letter-spacing:.04em}
  .level-meta{margin-top:22px;display:flex;gap:10px;flex-wrap:wrap}
  .chip{
    font-size:11.5px;color:#c3cadb;letter-spacing:.14em;
    border:1px solid rgba(255,255,255,.13);border-radius:999px;padding:6px 14px;
    background:rgba(255,255,255,.03);
  }
  .chip b{color:var(--accent);font-weight:600;transition:color .6s}

  .cloud{display:flex;flex-wrap:wrap;gap:10px 8px;align-content:flex-start;min-height:180px}
  .tag{
    padding:9px 16px;border-radius:999px;
    border:1px solid rgba(255,255,255,.10);
    background:rgba(255,255,255,.035);
    color:#ccd2e0;cursor:pointer;white-space:nowrap;
    animation:tagIn .55s cubic-bezier(.2,.8,.3,1.25) backwards;
    transition:transform .25s,background .25s,border-color .25s,color .25s,box-shadow .25s;
  }
  .tag:hover{
    transform:translateY(-3px) scale(1.04);
    color:#fff;border-color:color-mix(in srgb,var(--accent) 65%,transparent);
    background:color-mix(in srgb,var(--accent) 15%,transparent);
    box-shadow:0 8px 22px rgba(0,0,0,.4);
  }
  .tag.s1{font-size:13px;padding:7px 13px;color:#aeb6c8}
  .tag.s2{font-size:14.5px}
  .tag.s3{font-size:16.5px;padding:11px 19px;color:#dfe4ef}
  .tag.hl{
    color:var(--accent);border-color:color-mix(in srgb,var(--accent) 45%,transparent);
    background:color-mix(in srgb,var(--accent) 9%,transparent);
  }
  .tag:active{transform:scale(.94)}
  @keyframes tagIn{from{opacity:0;transform:translateY(14px) scale(.9)}}

  /* ---------- 控制按钮 ---------- */
  .controls{display:flex;justify-content:center;align-items:center;gap:14px;margin:58px 0 0;flex-wrap:wrap}
  .btn{
    font-family:var(--sans);font-size:13.5px;letter-spacing:.16em;text-indent:.16em;
    padding:12px 26px;border-radius:999px;cursor:pointer;
    border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.04);color:#dfe3ee;
    transition:all .28s;touch-action:manipulation;
  }
  .btn:hover{border-color:var(--accent);color:#fff;transform:translateY(-2px);box-shadow:0 8px 20px rgba(0,0,0,.35)}
  .btn.on{background:var(--accent);border-color:var(--accent);color:#0d1017;font-weight:700}
  .arrow{width:46px;height:46px;border-radius:50%;padding:0;font-size:17px}

  /* ---------- 觉察卡片 ---------- */
  .overlay{
    position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:24px;
    background:rgba(7,9,14,.74);
    -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
    opacity:0;pointer-events:none;transition:opacity .4s;
  }
  .overlay.show{opacity:1;pointer-events:auto}
  .card{
    max-width:560px;width:100%;text-align:center;
    padding:58px 46px 46px;border-radius:30px;
    border:1px solid rgba(255,255,255,.13);
    background:linear-gradient(165deg,rgba(255,255,255,.08),rgba(255,255,255,.015));
    transform:scale(.88) translateY(18px);transition:transform .5s cubic-bezier(.2,.9,.3,1.15);
    box-shadow:0 30px 80px rgba(0,0,0,.5);
  }
  .overlay.show .card{transform:none}
  .card-level{font-size:12px;letter-spacing:.5em;text-indent:.5em;color:var(--accent);transition:color .6s}
  .card-word{
    font-family:var(--serif);font-weight:700;font-size:52px;letter-spacing:.12em;
    color:#fff;margin:26px 0 20px;line-height:1.3;word-break:break-all;
  }
  .card-prompt{color:var(--muted);font-size:14.5px;line-height:2.1;letter-spacing:.05em}
  .card .btn{margin-top:34px}

  /* ---------- 全览 ---------- */
  .fullview{max-width:1460px;margin:110px auto 40px;padding:0 26px}
  .fv-title{font-family:var(--serif);font-size:30px;letter-spacing:.2em;color:#fff;text-align:center}
  .fv-sub{text-align:center;color:#5d6577;font-size:12.5px;letter-spacing:.2em;margin:14px 0 40px}
  .fv-sub .swipe{display:none}
  .grid-wrap{overflow-x:auto;overflow-y:hidden;padding-bottom:6px}
  .grid{display:grid;grid-template-columns:repeat(9,1fr);gap:14px;min-width:1180px}
  .col{
    border:1px solid rgba(255,255,255,.08);border-radius:20px;
    padding:20px 12px 14px;background:rgba(255,255,255,.024);
    opacity:0;transform:translateY(26px);
    transition:opacity .8s ease,transform .8s cubic-bezier(.2,.7,.3,1);
    transition-delay:calc(var(--d)*70ms);
  }
  .col.in{opacity:1;transform:none}
  .col:hover{border-color:color-mix(in srgb,var(--colc) 55%,transparent);background:rgba(255,255,255,.045)}
  .col h4{font-family:var(--serif);text-align:center;font-size:17.5px;letter-spacing:.14em;color:#fff}
  .col .en{display:block;text-align:center;font-size:9px;letter-spacing:.3em;color:var(--colc);margin-top:6px}
  .col .cnt{display:block;text-align:center;font-size:10px;color:#5d6577;margin-top:5px;letter-spacing:.15em}
  .col .bar{width:30px;height:2px;margin:13px auto;background:var(--colc);opacity:.7;border-radius:2px}
  .col ul{list-style:none;margin-top:4px}
  .col li{
    font-size:12.5px;color:#b3bacb;text-align:center;padding:4.5px 0;
    border-bottom:1px dashed rgba(255,255,255,.055);letter-spacing:.03em;
  }
  .col li:last-child{border-bottom:none}

  footer{
    text-align:center;color:#4c5468;font-size:12px;letter-spacing:.18em;
    padding:30px 20px 46px;line-height:2.2;
  }
  footer .heart{color:var(--accent);transition:color .6s}

  @media (max-width:900px){
    .stage{grid-template-columns:1fr;gap:34px}
    .level-head{position:static}
    header{padding-top:52px}
    .subtitle{font-size:12px;letter-spacing:.18em}
    .card-word{font-size:40px}
  }
  @media (max-width:700px){
    .blob{filter:blur(64px)}
    .blob.b3{display:none}
  }
  @media (max-width:600px){
    header{padding:42px 14px 4px}
    .eyebrow{font-size:10px;letter-spacing:.35em;text-indent:.35em;padding:6px 13px;margin-bottom:20px}
    h1{letter-spacing:.1em;text-indent:.1em}
    .subtitle{font-size:11px;letter-spacing:.12em;text-indent:.12em;margin-top:12px}
    .hint{font-size:11px;padding:0 12px;line-height:1.8}
    .kbd{display:none}
    .spectrum-wrap{margin-top:32px;padding:0 14px}
    .spectrum{min-width:590px}
    .node .lbl{font-size:11.5px}
    main{margin-top:42px;padding:0 16px}
    .stage{gap:26px}
    .level-name{letter-spacing:.06em}
    .level-rule{margin:16px 0}
    .level-desc{font-size:13.5px;line-height:1.95}
    .level-meta{margin-top:16px;gap:8px}
    .cloud{gap:8px 7px;min-height:140px}
    .tag.s1{font-size:12px;padding:6px 11px}
    .tag.s2{font-size:13.5px;padding:8px 14px}
    .tag.s3{font-size:15px;padding:10px 16px}
    .controls{gap:10px;margin-top:40px}
    .btn{font-size:12px;padding:10px 18px;letter-spacing:.1em;text-indent:.1em}
    .arrow{width:40px;height:40px;font-size:15px}
    .overlay{padding:16px}
    .card{padding:42px 24px 34px;border-radius:24px}
    .card-level{letter-spacing:.35em;text-indent:.35em}
    .card-word{font-size:31px;margin:20px 0 14px}
    .card-prompt{font-size:13px}
    .card .btn{margin-top:26px}
    .fullview{margin:70px auto 20px;padding:0 14px}
    .fv-title{font-size:22px}
    .fv-sub{font-size:11px;margin:10px 0 22px}
    .fv-sub .swipe{display:inline}
    .grid{min-width:1060px;gap:10px}
    .col{padding:14px 7px 10px;border-radius:14px}
    .col h4{font-size:15px}
    .col li{font-size:11.5px;padding:4px 0}
    footer{font-size:11px;padding:24px 16px 36px}
  }
</style>
</head>
<body>

<div class="aurora"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>
<canvas id="bg"></canvas>

<header>
  <span class="eyebrow">情 绪 觉 察 · 九 阶 能 量 表</span>
  <h1>情绪光谱</h1>
  <p class="subtitle">从 万 念 俱 灰 ， 走 向 平 和</p>
  <p class="hint">点击下方节点切换层级 · 点击任意词语卡片觉察它<span class="kbd"> · 键盘 ← → / 数字键 1–9 快速切换</span></p>
</header>

<div class="spectrum-wrap">
  <nav class="spectrum" id="spectrum">
    <div class="track"></div>
    <div class="track-fill" id="trackFill"></div>
    <div class="nodes" id="nodes"></div>
  </nav>
</div>

<main>
  <section class="stage">
    <div class="level-head">
      <div class="level-idx" id="levelIdx">01 — 09</div>
      <h2 class="level-name" id="levelName">万念俱灰</h2>
      <div class="level-en" id="levelEn">APATHY</div>
      <div class="level-rule"></div>
      <p class="level-desc" id="levelDesc"></p>
      <div class="level-meta">
        <span class="chip">情绪词 <b id="levelCount">0</b> 个</span>
        <span class="chip">能量 <b id="levelEnergy">Ⅰ</b> 阶</span>
      </div>
    </div>
    <div class="cloud" id="cloud"></div>
  </section>

  <div class="controls">
    <button class="btn arrow" id="prevBtn" title="上一层">←</button>
    <button class="btn" id="randBtn">随 机 一 词</button>
    <button class="btn" id="autoBtn">漫 游</button>
    <button class="btn arrow" id="nextBtn" title="下一层">→</button>
  </div>
</main>

<section class="fullview" id="fullview">
  <h3 class="fv-title">APFLG</h3>
  <p class="fv-sub">共 398 个情绪词 · 向下滚动，见证能量由暗到亮<span class="swipe"> · 左右滑动查看</span></p>
  <div class="grid-wrap"><div class="grid" id="grid"></div></div>
</section>

<div class="overlay" id="overlay">
  <div class="card">
    <div class="card-level" id="cardLevel"></div>
    <div class="card-word" id="cardWord"></div>
    <p class="card-prompt" id="cardPrompt"></p>
    <button class="btn" id="closeBtn">回 到 光 谱</button>
  </div>
</div>

<footer>
  数据源自「情绪表」：九个情绪层级 · 三百九十八个情绪词<br>
  愿你在每一次觉察中，<span class="heart">从低谷走向平和</span>
</footer>

/* ================= 工具 ================= */
const $=s=>document.querySelector(s);
const hex2rgb=h=>{const n=parseInt(h.slice(1),16);return[(n>>16)&255,(n>>8)&255,n&255]};
const ROMAN=["Ⅰ","Ⅱ","Ⅲ","Ⅳ","Ⅴ","Ⅵ","Ⅶ","Ⅷ","Ⅸ"];
let cur=0,timer=null;

/* ================= 光谱导航 ================= */
const nodesBox=$("#nodes");
LEVELS.forEach((lv,i)=>{
  const b=document.createElement("button");
  b.className="node";
  b.innerHTML=`<span class="dot"></span><span class="lbl">${lv.name}</span><span class="num">0${i+1}</span>`;
  b.addEventListener("click",()=>go(i));
  nodesBox.appendChild(b);
});
const nodes=[...document.querySelectorAll(".node")];

/* ================= 层级渲染 ================= */
function go(i){
  cur=(i+LEVELS.length)%LEVELS.length;
  const lv=LEVELS[cur];
  document.documentElement.style.setProperty("--accent",lv.color);
  nodes.forEach((n,k)=>n.classList.toggle("active",k===cur));
  $("#trackFill").style.width=(cur/(LEVELS.length-1)*100)+"%";

  const wrapEl=document.querySelector(".spectrum-wrap"),an=nodes[cur];
  const r=an.getBoundingClientRect(),wr=wrapEl.getBoundingClientRect();
  wrapEl.scrollTo({left:wrapEl.scrollLeft+(r.left+r.width/2-wr.left-wr.width/2),behavior:"smooth"});

  const nameEl=$("#levelName"),descEl=$("#levelDesc");
  nameEl.classList.remove("re");descEl.classList.remove("re");
  void nameEl.offsetWidth;
  nameEl.classList.add("re");descEl.classList.add("re");
  $("#levelIdx").textContent=`0${cur+1} — 09`;
  nameEl.textContent=lv.name;
  $("#levelEn").textContent=lv.en;
  descEl.textContent=lv.desc;
  $("#levelCount").textContent=lv.words.length;
  $("#levelEnergy").textContent=ROMAN[cur];

  const cloud=$("#cloud");
  cloud.innerHTML="";
  lv.words.forEach((w,k)=>{
    const t=document.createElement("span");
    const len=w.length;
    t.className="tag "+(len<=2?"s1":len<=4?"s2":"s3");
    t.textContent=w;
    t.style.animationDelay=Math.min(k*22,1400)+"ms";
    t.addEventListener("click",()=>t.classList.toggle("hl"));
    cloud.appendChild(t);
  });
  pool=lv.words.slice();
}

/* ================= 漫游 / 切换 ================= */
function step(d){go(cur+d)}
$("#prevBtn").addEventListener("click",()=>step(-1));
$("#nextBtn").addEventListener("click",()=>step(1));
$("#autoBtn").addEventListener("click",()=>{
  if(timer){clearInterval(timer);timer=null;$("#autoBtn").classList.remove("on");$("#autoBtn").textContent="漫 游";}
  else{timer=setInterval(()=>step(1),3800);$("#autoBtn").classList.add("on");$("#autoBtn").textContent="漫游中";}
});

/* ================= 觉察卡片 ================= */
const overlay=$("#overlay");
function openCard(li,wi){
  const lv=LEVELS[li],w=lv.words[wi];
  $("#cardLevel").textContent=`${lv.name} · ${lv.en}`;
  $("#cardWord").textContent=w;
  $("#cardPrompt").textContent=li>=6
    ?"让这份美好的感受在心中多停留一会儿，让它慢慢滋养你的每一天。"
    :"此刻，看见它、承认它，允许这个感受自然流经——然后，轻轻放下。";
  overlay.classList.add("show");
  document.body.style.overflow="hidden";
  if(timer){clearInterval(timer);timer=null;$("#autoBtn").classList.remove("on");$("#autoBtn").textContent="漫 游";}
}
function closeCard(){overlay.classList.remove("show");document.body.style.overflow=""}
$("#closeBtn").addEventListener("click",closeCard);
overlay.addEventListener("click",e=>{if(e.target===overlay)closeCard()});
$("#randBtn").addEventListener("click",()=>{
  const k=Math.floor(Math.random()*LEVELS[cur].words.length);
  openCard(cur,k);
});

/* ================= 键盘 ================= */
document.addEventListener("keydown",e=>{
  if(e.key==="Escape")return closeCard();
  if(overlay.classList.contains("show"))return;
  if(e.key==="ArrowRight")step(1);
  else if(e.key==="ArrowLeft")step(-1);
  else if(/^[1-9]$/.test(e.key))go(+e.key-1);
});

/* ================= 漂浮词粒子 ================= */
const cv=$("#bg"),ctx=cv.getContext("2d");
let W,H,parts=[],pool=[];
function resize(){
  W=cv.width=innerWidth*devicePixelRatio;
  H=cv.height=innerHeight*devicePixelRatio;
  cv.style.width=innerWidth+"px";cv.style.height=innerHeight+"px";
}
addEventListener("resize",resize);resize();
function spawn(p){
  p=p||{};
  p.x=Math.random()*W;
  p.y=H+40*Math.random()+20;
  p.vy=-(.18+Math.random()*.4)*devicePixelRatio;
  p.vx=(Math.random()-.5)*.14*devicePixelRatio;
  p.s=(11+Math.random()*10)*devicePixelRatio;
  p.a=.05+Math.random()*.13;
  p.w=pool[Math.random()*pool.length|0]||"";
  return p;
}
for(let i=0;i<(innerWidth<700?14:26);i++){const p=spawn();p.y=Math.random()*H;parts.push(p)}
const rgb=()=>hex2rgb(LEVELS[cur].color);
(function loop(){
  ctx.clearRect(0,0,W,H);
  const[r,g,b]=rgb();
  for(const p of parts){
    p.x+=p.vx;p.y+=p.vy;
    if(p.y<-40||p.x<-60||p.x>W+60){spawn(p);p.w=pool[Math.random()*pool.length|0]||p.w}
    ctx.font=`${p.s}px KaiTi, STKaiti, serif`;
    ctx.fillStyle=`rgba(${r},${g},${b},${p.a})`;
    ctx.fillText(p.w,p.x,p.y);
  }
  requestAnimationFrame(loop);
})();

/* ================= 全览表格 ================= */
const grid=$("#grid");
LEVELS.forEach((lv,i)=>{
  const d=document.createElement("div");
  d.className="col";d.style.setProperty("--colc",lv.color);d.style.setProperty("--d",i%5);
  d.innerHTML=`<h4>${lv.name}</h4><span class="en">${lv.en}</span><span class="bar"></span>
    <span class="cnt">${lv.words.length} 词 · ${ROMAN[i]}</span>
    <ul>${lv.words.map(w=>`<li>${w}</li>`).join("")}</ul>`;
  grid.appendChild(d);
});
const io=new IntersectionObserver(es=>es.forEach(e=>{
  if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}
}),{threshold:.08});
document.querySelectorAll(".col").forEach(c=>io.observe(c));

/* ================= 启动 ================= */
go(0);
</script>
</body>
</html>
